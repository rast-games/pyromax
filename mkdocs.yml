docs_dir: docs
site_name: Pyromax 0.8 Documentation
site_description: Asynchronous framework for MAX Messenger userbots
site_url: https://docs.pyromax.org/
repo_url: https://github.com/rast-games/pyromax
repo_name: rast-games/pyromax
site_author: Rast
theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: pink
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: yellow
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.tabs.link
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
nav:
  - Home: index.md
  - Getting started:
      - Quick start: quickstart.md
      - Authentication: authentication.md
  - Guide:
      - Architecture: guide/architecture.md
      - Routing and handlers: guide/routing.md
      - Filters: guide/filters.md
      - Middlewares and DI: guide/middlewares.md
      - FSM: guide/fsm.md
      - Models and helpers: guide/models.md
  - API reference:
      - Overview: api/index.md
      - Authentication internals: api/auth.md
      - MaxApi: api/maxapi.md
      - Dispatcher and Router: api/dispatcher.md
      - Filters: api/filters.md
      - FSM: api/fsm.md
      - Models: api/models.md
  - Documentation versioning: versioning.md
plugins:
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: ru
          name: Русский
          build: true
          site_name: Документация Pyromax 0.8
          site_description: Асинхронный фреймворк для юзерботов MAX Messenger
          theme:
            palette:
              - media: "(prefers-color-scheme: light)"
                scheme: default
                primary: indigo
                accent: pink
                toggle:
                  icon: material/weather-night
                  name: Включить тёмную тему
              - media: "(prefers-color-scheme: dark)"
                scheme: slate
                primary: red
                accent: yellow
                toggle:
                  icon: material/weather-sunny
                  name: Включить светлую тему
          nav_translations:
            Home: Главная
            Getting started: Начало работы
            Quick start: Быстрый старт
            Authentication: Авторизация
            Authentication internals: Внутренний API авторизации
            Guide: Руководство
            Architecture: Архитектура
            Routing and handlers: Роутинг и обработчики
            Filters: Фильтры
            Middlewares and DI: Middleware и DI
            FSM: Машина состояний
            Models and helpers: Модели и помощники
            API reference: Справочник API
            Overview: Обзор
            Dispatcher and Router: Dispatcher и Router
            Models: Модели
            Documentation versioning: Версионирование документации
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: sphinx
            inherited_members: false
            merge_init_into_class: true
            separate_signature: true
            show_if_no_docstring: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            show_source: true
            members_order: source
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra:
  version:
    provider: mike
    default: latest
    alias: true

copyright: Documentation for Pyromax 0.8
